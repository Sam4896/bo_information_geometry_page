name: Deploy project website

on:
  push:
    branches: [NeurIPS_publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
      - name: Check public site boundaries
        run: |
          test -f site/index.html
          test -f site/fitr/index.html
          test ! -d site/boing
          test ! -d site/paper
          test ! -d site/rebuttal
          if grep -R 'href="boing/index.html"' site --include='*.html'; then
            echo 'A private workspace link must not be published.'
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
